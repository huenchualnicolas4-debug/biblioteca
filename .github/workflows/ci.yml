name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias (solo binarios, versiones fijas con hash)
        run: pip install --only-binary :all: --require-hashes -r requirements-ci.txt
      - name: Pruebas unitarias con cobertura
        run: pytest --cov=servicios --cov-report=xml --cov-fail-under=90
      - name: Analisis estatico
        run: pylint servicios --fail-under=9
